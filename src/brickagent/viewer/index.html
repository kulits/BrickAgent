<body>
<div id="scene"></div><div id="status">Loading…</div>
<div id="help">Drag to orbit · scroll to zoom · right-drag to pan · F to fit</div>
<script type="module">
import { createViewer } from './viewer.js';
import { LDrawLoader } from './LDrawLoader.js';
const status = document.querySelector('#status');
const params = new URLSearchParams(location.search);
try {
  const [text, palette] = await Promise.all([
    fetch(params.get('model') || 'model.mpd').then(r => { if (!r.ok) throw new Error('Missing model'); return r.text(); }),
    fetch('../_data/v1/colors.json').then(r => r.json()),
  ]);
  const viewer = createViewer(document.querySelector('#scene'));
  const loader = new LDrawLoader().setPartsLibraryPath(params.get('ldraw') || '');
  const count = await viewer.load(text, palette.colors, loader);
  viewer.frame();
  viewer.render();
  status.textContent = `${count.toLocaleString()} pieces`;
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { viewer.frame(); viewer.render(); } });
} catch (error) {
  status.textContent = error.message;
  console.error(error);
}
</script>
</body>
</html>
